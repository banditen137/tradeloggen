<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tradeloggen</title>
<meta name="description" content="Stockrobbers köp- och säljsignaler, med tydliga besked om när du ska agera.">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tradeloggen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css?v=1794669167">
</head>
<body class="auth">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 16 16"><path d="M2 11.5 6 7.5l2.5 2.5L14 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m11 12 8-8m-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Zm4 4a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- Inloggning -->
<section class="login" id="loginView" hidden>
  <div class="brand"><i><svg><use href="#i-logo"/></svg></i>Tradeloggen</div>
  <form id="loginForm" autocomplete="on">
    <label>Användarnamn eller e-post<input id="loginUser" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label>Lösenord<input id="loginPass" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit" id="loginBtn">Logga in</button>
    <p class="status" id="loginStatus" role="status"></p>
  </form>
</section>

<!-- Appen -->
<div id="appView" hidden>
  <div class="wrap">
    <header class="top">
      <div class="bar1">
        <div class="brand"><i><svg><use href="#i-logo"/></svg></i>Tradeloggen</div>
        <div class="menu">
          <button class="icon" id="newBtn" type="button" aria-label="Lägg till egen aktie" title="Lägg till egen aktie"><svg><use href="#i-plus"/></svg></button>
          <button class="icon" id="bellBtn" type="button" aria-label="Notiser" title="Notiser"><svg><use href="#i-bell"/></svg></button>
          <button class="icon" id="pwBtn" type="button" aria-label="Byt lösenord" title="Byt lösenord"><svg><use href="#i-key"/></svg></button>
          <button class="icon" id="logoutBtn" type="button" aria-label="Logga ut" title="Logga ut"><svg><use href="#i-out"/></svg></button>
        </div>
      </div>
      <p class="headline" id="headline">Hämtar…</p>
      <div class="pulse" id="markets"></div>
      <div class="note blue" id="pushTip" hidden></div>
    </header>

    <nav class="tabs" aria-label="Vy">
      <button class="tab" type="button" data-f="sig" aria-pressed="true">Signaler <span class="c" id="cSig">0</span></button>
      <button class="tab" type="button" data-f="pos" aria-pressed="false">Mina aktier <span class="c" id="cPos">0</span></button>
      <button class="tab" type="button" data-f="his" aria-pressed="false">Historik <span class="c" id="cHis">0</span></button>
    </nav>

    <main class="list" id="list"></main>
    <p class="updated" id="updated"></p>
  </div>

  <!-- Jag köpte -->
  <div class="sheet" id="buySheet" hidden>
    <form id="buyForm" autocomplete="off">
      <div class="grab"></div>
      <h2 id="buyTitle">Jag köpte</h2>
      <label class="btn wide imp" for="b-img"><span id="impLbl">📷 Läs in skärmbild från Avanza</span><input id="b-img" type="file" accept="image/*" multiple hidden></label>
      <p class="hint" id="impHint">Ta en skärmbild på innehavet eller certifikatets sida (gärna båda). Appen fyller i allt nedan.</p>
      <div class="grid" id="manualFields">
        <label class="full">Aktie<input id="b-aktie" placeholder="t.ex. Volvo B"></label>
        <label class="full">TradingView-symbol<input id="b-ticker" placeholder="t.ex. OMXSTO:VOLV_B eller NASDAQ:GOOGL" autocapitalize="characters"></label>
        <label>Stopp<input id="b-stopp" inputmode="decimal"></label>
        <label>Mål<input id="b-mal1" inputmode="decimal"></label>
      </div>
      <div class="grid">
        <label class="full">Instrument<select id="b-instr"><option>Mini L</option><option>Aktie</option><option>Turbo L</option></select></label>
      </div>
      <div class="grid" id="certFields">
        <label>Finansieringsnivå<input id="b-fin" inputmode="decimal" placeholder="från Avanza"></label>
        <label>Stop loss<input id="b-ko" inputmode="decimal" placeholder="från Avanza"></label>
        <label>Cert. köpkurs (kr)<input id="b-ck" inputmode="decimal" placeholder="Inköpskurs"></label>
        <label>Cert. kurs nu (kr)<input id="b-cn" inputmode="decimal" placeholder="Kurs"></label>
        <label>Antal<input id="b-antal" inputmode="decimal" placeholder="st"></label>
        <label>Certifikatets namn<input id="b-cnamn" placeholder="t.ex. MINI L ABB AVA 16"></label>
      </div>
      <div class="grid">
        <label class="full">Aktiens kurs när du köpte<input id="b-kop" inputmode="decimal" required></label>
        <label class="full" id="antalAktie" hidden>Antal aktier<input id="b-antal2" inputmode="decimal" placeholder="st"></label>
      </div>
      <p class="hint" id="buyHint">Certifikatets stopnivå står på Avanza och anges i aktiens pris.</p>
      <p class="status" id="buyStatus" role="status"></p>
      <div class="btns">
        <button class="btn ghost" type="button" id="buyCancel">Avbryt</button>
        <button class="btn primary" type="submit" id="buySave">Spara</button>
      </div>
    </form>
  </div>

  <!-- Notiser -->
  <div class="sheet" id="pushSheet" hidden>
    <form id="pushForm" autocomplete="off">
      <div class="grab"></div>
      <h2>Notiser</h2>
      <p class="hint" id="pushText"></p>
      <p class="status" id="pushStatus" role="status"></p>
      <div class="btns">
        <button class="btn ghost" type="button" id="pushClose">Stäng</button>
        <button class="btn primary" type="submit" id="pushOn">Slå på notiser</button>
        <button class="btn wide" type="button" id="pushTest" hidden>Skicka en testnotis</button>
      </div>
    </form>
  </div>

  <!-- Byt lösenord -->
  <div class="sheet" id="pwSheet" hidden>
    <form id="pwForm" autocomplete="off">
      <div class="grab"></div>
      <h2>Byt lösenord</h2>
      <label>Nytt lösenord (minst 8 tecken)<input id="pwNew" type="password" required minlength="8" autocomplete="new-password"></label>
      <label>Upprepa<input id="pwNew2" type="password" required minlength="8" autocomplete="new-password"></label>
      <p class="status" id="pwStatus" role="status"></p>
      <div class="btns">
        <button class="btn ghost" type="button" id="pwCancel">Avbryt</button>
        <button class="btn primary" type="submit" id="pwSave">Spara</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=1794669167"></script>
<script src="/app.js?v=1794669167"></script>
</body>
</html>
