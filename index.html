<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tradeloggen</title>
<meta name="description" content="Stockrobbers signaler och dina trades på ett ställe.">
<meta name="theme-color" content="#1d5fb4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tradeloggen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css?v=1793815977">
</head>
<body class="auth">

<!-- Inloggning -->
<section class="login" id="loginView" hidden>
  <h1>Tradeloggen</h1>
  <div class="card">
    <form id="loginForm" class="inline" autocomplete="on">
      <label>Användarnamn<input id="loginUser" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="t.ex. edwin"></label>
      <label>Lösenord<input id="loginPass" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit" id="loginBtn">Logga in</button>
      <p class="status" id="loginStatus" role="status"></p>
    </form>
  </div>
</section>

<!-- Appen -->
<div id="appView" hidden>
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <h1>Tradeloggen</h1>
        <div class="who"><span id="whoEmail"></span><button class="linkbtn" id="pwBtn" type="button">Byt lösenord</button><button class="linkbtn" id="logoutBtn" type="button">Logga ut</button></div>
      </div>
      <section class="hero" aria-label="Portfölj">
        <div class="hero-main">
          <span class="eyebrow">Aktiva trades · sedan köp</span>
          <b class="hero-num" id="hPl">0 kr</b>
          <span class="hero-sub" id="hPlPct">Inga aktiva trades än</span>
        </div>
        <div class="hero-grid">
          <div><span>Insatt</span><b id="hCap">0 kr</b></div>
          <div><span>Idag</span><b id="hDay">–</b></div>
          <div><span>Realiserat</span><b id="hRes">0 kr</b></div>
          <div><span>Träffsäkerhet</span><b id="hHit">–</b></div>
        </div>
        <div class="markets" id="markets"></div>
      </section>
      <p class="status" id="loadStatus" role="status">Hämtar…</p>
    </header>
    <main class="list" id="list"></main>
    <p class="updated" id="updated"></p>
  </div>

  <nav class="tabbar" aria-label="Filter"><div class="in">
    <button class="tab" type="button" data-f="Signal" aria-pressed="true"><b id="cSignal">0</b>Signaler</button>
    <button class="tab" type="button" data-f="Öppen" aria-pressed="false"><b id="cÖppen">0</b>Aktiva</button>
    <button class="tab" type="button" data-f="Planerad" aria-pressed="false"><b id="cPlanerad">0</b>Planerade</button>
    <button class="tab" type="button" data-f="Stängd" aria-pressed="false"><b id="cStängd">0</b>Stängda</button>
  </div></nav>
  <button class="fab" id="newBtn" type="button" aria-label="Ny trade">+</button>

  <div class="sheet" id="pwSheet" hidden>
    <form id="pwForm" autocomplete="off">
      <div class="grab"></div>
      <h2>Byt lösenord</h2>
      <label>Nytt lösenord (minst 8 tecken)<input id="pwNew" type="password" required minlength="8" autocomplete="new-password"></label>
      <label>Upprepa<input id="pwNew2" type="password" required minlength="8" autocomplete="new-password"></label>
      <p class="status" id="pwStatus" role="status"></p>
      <div class="btns">
        <button class="btn quiet" type="button" id="pwCancel">Avbryt</button>
        <button class="btn primary" type="submit" id="pwSave">Spara</button>
      </div>
    </form>
  </div>

  <div class="sheet" id="sheet" hidden>
    <form id="form" autocomplete="off">
      <div class="grab"></div>
      <h2>Ny trade</h2>
      <div class="grid">
        <label class="full">Aktie<input id="f-aktie" required placeholder="t.ex. Alphabet"></label>
        <label class="full">TradingView-symbol<input id="f-ticker" placeholder="t.ex. NASDAQ:GOOGL eller OMXSTO:VOLV_B" autocapitalize="characters"></label>
        <label>Valuta<select id="f-valuta"><option>SEK</option><option>USD</option><option>EUR</option></select></label>
        <label>Status<select id="f-status"><option>Planerad</option><option value="Öppen">Aktiv (köpt)</option></select></label>
        <label>Instrument<select id="f-instr"><option>Mini L</option><option>Aktie</option><option>Turbo L</option></select></label>
        <label>Hävstång (x)<input id="f-lev" inputmode="decimal" placeholder="3"></label>
        <label>Köpnivå<input id="f-kop" inputmode="decimal" required placeholder="265"></label>
        <label>Stopp<input id="f-stopp" inputmode="decimal" placeholder="252"></label>
        <label>Mål 1<input id="f-mal1" inputmode="decimal" placeholder="287"></label>
        <label>Mål 2<input id="f-mal2" inputmode="decimal" placeholder="315"></label>
        <label>Certifikatets stopnivå<input id="f-ko" inputmode="decimal" placeholder="240"></label>
        <label>Insats (kr)<input id="f-insats" inputmode="decimal" placeholder="6500"></label>
        <label class="full">Anteckning<textarea id="f-note" placeholder="Varför: t.ex. Stockrobber köper i zonen 257–272"></textarea></label>
      </div>
      <p class="hint">Certifikatets stopnivå står under certifikatet på Avanza. Den anges i aktiens pris, så samma siffra kan ritas in i TradingView.</p>
      <p class="status" id="formStatus" role="status"></p>
      <div class="btns">
        <button class="btn quiet" type="button" id="cancelBtn">Avbryt</button>
        <button class="btn primary" type="submit" id="saveBtn">Spara</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js?v=1793815977"></script>
<script src="/app.js?v=1793815977"></script>
</body>
</html>
